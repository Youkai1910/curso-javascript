<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: system-ui, sans-serif;
            background: #f4f4f4;
        }

        form {
            background: white;
            padding: 20px;
            width: 80%;
            max-width: 800px;
            margin: 40px auto;
        }

        section {
            background: white;
            padding: 20px;
            width: 80%;
            max-width: 800px;
            margin: 40px auto;
        }
       
    </style>
</head>

<body>
    
    <h1>Exercício: Sistema de Cálculo de Média</h1>
    <hr>

    <form id="cadastro" autocomplete="off">

        <p>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>
        </p>

        <p>
            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" min="0" max="10" step="0.1" required>

            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" min="0" max="10" step="0.1" required>
        </p>

        <button>Calcular média</button>

    </form>

    <section>
        <h3>Resultados</h3>
        <div id="resultados"></div>
    </section>

<script src="01-exercicios-dom-eventos.js"></script>
</body>

</html>
