<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Revisando HTML e CSS</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <header>
        <h1>Site de Revisão</h1>
    </header>

    <nav>
        <a href="estrutura-basica.html">Home</a>
        <a href="">Produtos</a>
        <a href="contato.html">Contatos</a>
    </nav>

    <main>
        <article>
            <h2>Contato</h2>
            <form action="" method="post">
                <p>
                    <label for="nome">Nome:</label>
                    <input type="text" name="nome" id="nome" placeholder="Nome Completo">

                </p>

                <p><label for="">E-mail:</label>
                    <input type="email" name="email" id="email">
                </p>

                <p><label for="mensagem">Mensagem:</label>
                    <textarea name="mensagem" id="mensagem" cols="30"></textarea>
                </p>

                <button type="submit">Enviar</button>

            </form>

        </article>
    </main>

    <footer>
        <p>Site criado por <b>Alexandre</b></p>
    </footer>

</body>

</html>
